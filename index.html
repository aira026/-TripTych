<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6ead9"><meta name="description" content="【歷歷】Triptych 旅行足跡與行程手冊">
<title>【歷歷】/ Triptych</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top">
 <button class="menu" data-a="menu" aria-label="開啟選單" aria-controls="drawer">☰</button>
 <div><p class="eyebrow">Triptych</p><h1>【歷歷】/ Triptych</h1><p class="crumb" id="crumb">北海道 › 行程總覽</p></div>
</header>
<aside class="drawer" id="drawer" aria-label="目錄">
 <p class="eyebrow">Triptych</p><h2>【歷歷】/ Triptych</h2>
 <p class="grp">❄️ 當前旅程　北海道</p>
 <button class="sub on" data-t="now" data-c="北海道 › 行程總覽">行程總覽</button>
 <button class="sub" data-t="tix" data-c="北海道 › 票券與預約">票券與預約</button>
 <button class="sub" data-t="storm" data-c="北海道 › 暴風雪備案">暴風雪備案</button>
 <button class="sub" data-t="yen" data-c="北海道 › 匯率與公費">匯率與公費</button>
 <button class="sub" data-t="pack" data-c="北海道 › 打包清單">打包清單</button>
 <p class="grp">其他旅程</p>
 <button data-t="map" data-c="全球足跡">🌍 全球足跡</button>
 <button data-t="past" data-c="歷史旅程">📚 歷史旅程</button>
 <button data-t="future" data-c="未來清單">✨ 未來清單</button>
 <p class="meta" style="margin-top:auto">資料只存在這支手機，免登入。</p>
</aside><div class="scrim" id="scrim" data-a="menu"></div>
<main>
 <section id="t-now" class="panel on" aria-label="當前行程"></section>
 <section id="t-tix" class="panel" aria-label="票券與預約"></section>
 <section id="t-storm" class="panel" aria-label="暴風雪備案"></section>
 <section id="t-yen" class="panel" aria-label="匯率與公費"></section>
 <section id="t-pack" class="panel" aria-label="打包清單"></section>
 <section id="t-map" class="panel" aria-label="全球足跡"><div class="stats" id="stats"></div><div class="glass mapbox"><div id="map" role="application" aria-label="足跡地圖"></div></div></section>
 <section id="t-past" class="panel" aria-label="歷史旅程"><div class="pills addrow"><button class="pill" data-a="add" data-v="past"><span class="dot">＋</span>新增旅程</button></div><div class="grid" id="l-past"></div></section>
 <section id="t-future" class="panel" aria-label="未來清單"><div class="pills addrow"><button class="pill" data-a="add" data-v="future"><span class="dot">＋</span>新增旅程</button></div><div class="grid" id="l-future"></div></section>
</main>
<div id="modal" class="modal"><div class="sheet glass" id="sheet"></div></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script><script src="app.js"></script>
</body></html>
