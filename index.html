<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e6f2fa"><meta name="description" content="Triptych 旅行足跡與行程手冊">
<title>Triptych 旅行足跡</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top">
 <div><p class="eyebrow">Triptych</p><h1>旅行足跡</h1></div><span id="lock" class="lock"></span>
 <div class="seg" role="group" aria-label="切換身份">
  <button data-u="Ai">👧 艾庭</button><button data-u="Partner">👦 隊友</button><button data-u="shared">👩‍❤️‍👨 共同足跡</button>
 </div>
</header>
<main>
 <section id="t-now" class="panel on" aria-label="當前行程"></section>
 <section id="t-map" class="panel" aria-label="全球足跡"><div class="stats" id="stats"></div><div class="glass mapbox"><div id="map" role="application" aria-label="足跡地圖"></div></div></section>
 <section id="t-past" class="panel" aria-label="歷史足跡"></section>
 <section id="t-future" class="panel" aria-label="未來清單"></section>
</main>
<nav class="bar" aria-label="主要導覽">
 <button data-t="now" class="on"><i>❄️</i>當前</button><button data-t="map"><i>🌍</i>足跡</button><button data-t="past"><i>📜</i>歷史</button><button data-t="future"><i>💡</i>未來</button>
</nav>
<div id="modal" class="modal"><div class="sheet glass" id="sheet"></div></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script><script src="app.js"></script>
</body></html>
