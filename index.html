<link rel="stylesheet" href="style.css"></head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top">
 <button class="menu" data-a="menu" aria-label="開啟選單" aria-controls="drawer">☰</button>
 <div><a href="./" class="brand" data-a="home" aria-label="回到首頁"><span class="eyebrow">TripTych</span><h1>【歷歷】/ TripTych</h1></a><p class="crumb" id="crumb"></p></div><button class="who" id="who" data-a="auth" aria-label="登入／登出">登入</button>
</header>
<aside class="drawer" id="drawer" aria-label="目錄"></aside><div class="scrim" id="scrim" data-a="menu"></div>
<main>
 <section id="t-now" class="panel on" aria-label="當前行程"></section>
 <section id="t-tix" class="panel" aria-label="票券與預約"></section>
 <section id="t-storm" class="panel" aria-label="備忘錄"></section>
 <section id="t-yen" class="panel" aria-label="匯率與公費"></section>
 <section id="t-pack" class="panel" aria-label="打包清單"></section>
 <section id="t-map" class="panel" aria-label="全球足跡"><div class="stats" id="stats"></div><div class="glass mapbox"><div id="map" role="application" aria-label="足跡地圖"></div></div></section>
 <section id="t-past" class="panel" aria-label="歷史旅程"><div class="pills addrow"><button class="pill" data-a="add" data-v="past"><span class="dot">＋</span>新增旅程</button></div><div class="grid" id="l-past"></div></section>
 <section id="t-future" class="panel" aria-label="未來清單"><div class="pills addrow"><button class="pill" data-a="add" data-v="future"><span class="dot">＋</span>新增旅程</button></div><div class="grid" id="l-future"></div></section>
</main>
<div id="modal" class="modal"><div class="sheet glass" id="sheet"></div></div><div id="toast" class="toast"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="map.js"></script><script>addEventListener("error",function(e){if(window.__tp)return;var b=document.getElementById("t-now");if(b)b.innerHTML='<div class="glass blk"><p>⚠️ 程式載入失敗：'+String(e.message||"").replace(/</g,"&lt;")+'</p><p class="meta">常見原因：firebase-config.js 少了 export（請用 export const firebaseConfig = {…}）。</p></div>'});</script>
<script type="module" src="app.js"></script>
